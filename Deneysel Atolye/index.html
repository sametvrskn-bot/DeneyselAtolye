<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Model Sergisi</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Syne:wght@600;800&family=Space+Mono&display=swap');

  :root {
    --bg: #0a0e14;
    --panel: rgba(20, 26, 38, 0.72);
    --accent: #5ce1a8;
    --accent-dim: #2e7a5b;
    --text: #e6edf3;
    --muted: #7d8794;
    --border: rgba(92, 225, 168, 0.22);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Space Mono', monospace;
    background: var(--bg);
    color: var(--text);
    overflow: hidden;
    height: 100vh;
  }

  /* atmospheric background */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse at 70% 20%, rgba(92,225,168,0.10), transparent 55%),
      radial-gradient(ellipse at 20% 80%, rgba(60,120,200,0.10), transparent 55%);
    pointer-events: none;
    z-index: 0;
  }

  #canvas-wrap { position: fixed; inset: 0; z-index: 1; }
  canvas { display: block; }

  header {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 10;
    padding: 22px 28px;
    display: flex;
    align-items: baseline;
    gap: 14px;
    pointer-events: none;
  }
  header h1 {
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: clamp(20px, 3vw, 34px);
    letter-spacing: -0.5px;
  }
  header h1 span { color: var(--accent); }
  header .sub {
    color: var(--muted);
    font-size: 12px;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  /* control panel */
  .panel {
    position: fixed;
    bottom: 26px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px;
    background: var(--panel);
    backdrop-filter: blur(14px);
    border: 1px solid var(--border);
    border-radius: 16px;
    box-shadow: 0 18px 50px rgba(0,0,0,0.5);
  }

  .btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
    width: 46px;
    height: 46px;
    border-radius: 11px;
    cursor: pointer;
    font-size: 19px;
    display: grid;
    place-items: center;
    transition: all .18s ease;
    font-family: inherit;
  }
  .btn:hover { background: var(--accent); color: #06120c; border-color: var(--accent); transform: translateY(-2px); }
  .btn:active { transform: translateY(0); }
  .btn.active { background: var(--accent); color: #06120c; border-color: var(--accent); }

  .divider { width: 1px; height: 30px; background: var(--border); margin: 0 4px; }

  .upload-label {
    background: var(--accent);
    color: #06120c;
    border: none;
    height: 46px;
    padding: 0 18px;
    border-radius: 11px;
    cursor: pointer;
    font-weight: 600;
    font-size: 13px;
    display: grid;
    place-items: center;
    letter-spacing: 0.5px;
    transition: all .18s ease;
    white-space: nowrap;
  }
  .upload-label:hover { background: #6ff0b9; transform: translateY(-2px); }
  #file-input { display: none; }

  .hint {
    position: fixed;
    bottom: 88px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 9;
    color: var(--muted);
    font-size: 11px;
    letter-spacing: 1px;
    text-align: center;
  }

  #loading {
    position: fixed;
    inset: 0;
    z-index: 8;
    display: grid;
    place-items: center;
    color: var(--muted);
    font-size: 13px;
    letter-spacing: 2px;
    text-transform: uppercase;
  }
  #loading.hidden { display: none; }
</style>
</head>
<body>
  <div id="canvas-wrap"></div>

  <header>
    <h1>3D <span>SERGİ</span></h1>
    <div class="sub">model viewer</div>
  </header>

  <div id="loading">Demo model yükleniyor...</div>

  <div class="hint">Sürükle → döndür &nbsp;•&nbsp; Tekerlek → yakınlaş/uzaklaş</div>

  <div class="panel">
    <button class="btn" id="rotate-btn" title="Otomatik döndürme">⟳</button>
    <div class="divider"></div>
    <button class="btn" id="zoom-in" title="Yakınlaştır">+</button>
    <button class="btn" id="zoom-out" title="Uzaklaştır">−</button>
    <div class="divider"></div>
    <button class="btn" id="reset" title="Sıfırla">⌂</button>
    <div class="divider"></div>
    <label class="upload-label">
      MODEL YÜKLE
      <input type="file" id="file-input" accept=".glb,.gltf,.obj,.stl">
    </label>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.module.min.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';
    import { STLLoader } from 'three/addons/loaders/STLLoader.js';

    const wrap = document.getElementById('canvas-wrap');
    const loadingEl = document.getElementById('loading');

    // Scene
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a0e14);

    // Camera
    const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 1000);
    camera.position.set(4, 3, 6);

    // Renderer
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    wrap.appendChild(renderer.domElement);

    // Lights
    scene.add(new THREE.AmbientLight(0xffffff, 0.7));
    const key = new THREE.DirectionalLight(0xffffff, 1.6);
    key.position.set(5, 8, 6);
    scene.add(key);
    const fill = new THREE.DirectionalLight(0x5ce1a8, 0.5);
    fill.position.set(-6, 2, -4);
    scene.add(fill);

    // Ground grid
    const grid = new THREE.GridHelper(20, 20, 0x2e7a5b, 0x1a2230);
    grid.position.y = -1.5;
    scene.add(grid);

    // Controls
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.autoRotateSpeed = 2.5;

    let currentModel = null;
    const initialCamPos = camera.position.clone();

    // Fit model to view
    function frameModel(object) {
      const box = new THREE.Box3().setFromObject(object);
      const size = box.getSize(new THREE.Vector3());
      const center = box.getCenter(new THREE.Vector3());

      object.position.sub(center);
      const maxDim = Math.max(size.x, size.y, size.z);
      const scale = 3 / maxDim;
      object.scale.setScalar(scale);

      controls.target.set(0, 0, 0);
      camera.position.set(4, 3, 6);
      controls.update();
    }

    function setModel(object) {
      if (currentModel) scene.remove(currentModel);
      currentModel = object;
      scene.add(object);
      frameModel(object);
      loadingEl.classList.add('hidden');
    }

    // Default demo model (torus knot) so something shows immediately
    function loadDemo() {
      const geo = new THREE.TorusKnotGeometry(1, 0.32, 160, 24);
      const mat = new THREE.MeshStandardMaterial({
        color: 0x5ce1a8, metalness: 0.4, roughness: 0.25
      });
      setModel(new THREE.Mesh(geo, mat));
    }
    loadDemo();

    // File loading
    document.getElementById('file-input').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const ext = file.name.split('.').pop().toLowerCase();
      const url = URL.createObjectURL(file);
      loadingEl.textContent = 'Model yükleniyor...';
      loadingEl.classList.remove('hidden');

      const done = (obj) => { setModel(obj); URL.revokeObjectURL(url); };
      const fail = (err) => {
        loadingEl.textContent = 'Yüklenemedi: ' + ext;
        console.error(err);
      };

      if (ext === 'glb' || ext === 'gltf') {
        new GLTFLoader().load(url, (g) => done(g.scene), undefined, fail);
      } else if (ext === 'obj') {
        new OBJLoader().load(url, done, undefined, fail);
      } else if (ext === 'stl') {
        new STLLoader().load(url, (geo) => {
          const mat = new THREE.MeshStandardMaterial({ color: 0x5ce1a8, metalness: 0.3, roughness: 0.4 });
          done(new THREE.Mesh(geo, mat));
        }, undefined, fail);
      }
    });

    // Buttons
    const rotateBtn = document.getElementById('rotate-btn');
    rotateBtn.addEventListener('click', () => {
      controls.autoRotate = !controls.autoRotate;
      rotateBtn.classList.toggle('active', controls.autoRotate);
    });

    document.getElementById('zoom-in').addEventListener('click', () => {
      camera.position.lerp(controls.target, 0.18);
      controls.update();
    });
    document.getElementById('zoom-out').addEventListener('click', () => {
      const dir = camera.position.clone().sub(controls.target);
      camera.position.copy(controls.target).add(dir.multiplyScalar(1.22));
      controls.update();
    });
    document.getElementById('reset').addEventListener('click', () => {
      camera.position.copy(initialCamPos);
      controls.target.set(0, 0, 0);
      controls.autoRotate = false;
      rotateBtn.classList.remove('active');
      controls.update();
    });

    // Resize
    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    // Loop
    (function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    })();
  </script>
</body>
</html>
